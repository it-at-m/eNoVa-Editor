description:
  de:
    shortDescription: "Tool für Kommunen um digitale Vorkaufsrechtsanfragen zu lesen und zu beantworten"
    longDescription: Der eNoVa-Editor ist eine Java-Desktop-Anwendung um die ab
      01.01.2027 verpflichtende XJustiz-Kommunikation zwischen Kommunen und Notaren zu ermöglichen. Es ist keine beBPo- oder Signatursoftware sondern ist darauf spezialisiert, XJustiz.eNoVa.2900003-Dateien zu lesen, anzuzeigen und zu schreiben.
	  Siehe: https://xjustiz.justiz.de/Anwendungsfaelle/eNoVA/index.php
	  Wünsche und Anregungen sind willkommen - Codebeiträge bitte nur in Abstimmung.
    features:
      - Lesen von XJustiz.eNoVa.2900003.ersuchenSachentscheidung-Dateien
      - Schreiben von XJustiz.eNoVa.2900003.sachentscheidung-Dateien
      - Konvertierung beider XJustiz-Dateien in eine HTML-Datei in Briefform
  en:
    shortDescription: "Tool for municipalities to read and answer digital pre-emption right requests"
    longDescription: "German local government desktop application to process XJustiz.eNoVa.2900003 files regarding pre-emption rights from notaries, mandatory from January 2027."
